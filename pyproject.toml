[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zipcheck"
version = "0.1.0"
description = "Static zip-bomb and archive-bomb detector that never extracts anything"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zipcheck contributors" }]
keywords = [
  "zip-bomb",
  "decompression-bomb",
  "archive",
  "security",
  "static-analysis",
  "zip",
  "7z",
  "rar",
  "tar",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Archiving",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard>=0.22"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
zipcheck = "zipcheck.cli:main"

[project.urls]
Homepage = "https://github.com/example/zipcheck"
Documentation = "https://github.com/example/zipcheck#readme"
Issues = "https://github.com/example/zipcheck/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045", "SIM117"]
