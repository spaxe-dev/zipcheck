[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zipcheck"
dynamic = ["version"]
description = "Static zip-bomb and archive-bomb detector that never extracts anything"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zipcheck contributors" }]
keywords = [
  "zip-bomb",
  "decompression-bomb",
  "archive",
  "security",
  "static-analysis",
  "zip",
  "7z",
  "rar",
  "tar",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Archiving",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]
fuzz = [
  "atheris>=2.3; sys_platform == 'linux' and python_version < '3.13'",
]

[project.scripts]
zipcheck = "zipcheck.cli:main"

[project.urls]
Homepage = "https://github.com/spaxe-dev/zipcheck"
Documentation = "https://github.com/spaxe-dev/zipcheck#readme"
Repository = "https://github.com/spaxe-dev/zipcheck"
Issues = "https://github.com/spaxe-dev/zipcheck/issues"
Changelog = "https://github.com/spaxe-dev/zipcheck/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "zipcheck.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zipcheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["zipcheck"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.mypy]
files = ["src/zipcheck"]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045", "SIM117"]
